[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siar-app"
version = "0.3.0"
description = "Run the IDent Dynamics structure scanners over a folder of recordings"
readme = "README.md"
# An equality, not a floor. The scanner bundles this CLI downloads are PyArmor-obfuscated, and
# their bytecode is marshalled by the interpreter that built them — a cp313 bundle runs on 3.13
# and on no other version. Widening this would let pip install a CLI that can find no algorithm
# it is able to load. See src/siarapp/config.py's SUPPORTED_PYTHON.
requires-python = ">=3.13,<3.14"
authors = [{ name = "Vixen Intelligence" }]
license = { text = "MIT" }
keywords = ["acoustics", "sonar", "spectrogram", "detection", "bioacoustics"]

# Deliberately short. The PNG encoder and the HTTP client are stdlib here so that a
# customer install pulls in an array library and an audio reader, and nothing else.
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
siar-app = "siarapp.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# The quickstart page and its three companions are shipped inside the package, not left at the
# repository root, so that `siar-app quick-start` can still find them after `uv tool install`.
# The README is NOT duplicated here: `readme = "README.md"` above already puts the whole of it
# into the wheel's metadata, which is where siarapp/docs.py reads it back from.
[tool.setuptools.package-data]
siarapp = ["local_web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
